name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test portable implementations
      env:
        DOTNET_EnableHWIntrinsic: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test without AVX2 (Vector128 / SSSE3 paths)
      env:
        DOTNET_EnableAVX2: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test without SSSE3 and SSE4 (BCL Base64 encoding path)
      env:
        DOTNET_EnableSSE42: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test without AES and PCLMULQDQ (software AEGIS, table CRC-32)
      env:
        DOTNET_EnableAES: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Install coverage tool
      run: dotnet tool install --tool-path ./artifacts/tools dotnet-coverage --version 18.11.0
    - name: Collect coverage
      run: ./artifacts/tools/dotnet-coverage collect -s Test/coverage.config -f cobertura -o artifacts/coverage/coverage.cobertura.xml dotnet Test/bin/Release/net10.0/Test.dll
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: artifacts/coverage/coverage.cobertura.xml

  # Runs the ARM backends (AdvSimd, ARM AES) and the linux-arm64 native assets.
  build-arm64:
    name: Build and Test (linux-arm64)

    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test portable implementations
      env:
        DOTNET_EnableHWIntrinsic: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build

  nativeaot:
    name: Native AOT (${{ matrix.rid }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    env:
      # A unique version per run keeps a cached package with the same version from being validated instead.
      AOT_PACKAGE_VERSION: 1.0.0-aot-validation.${{ github.run_id }}.${{ github.run_attempt }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # AotSmoke roots the entire library and treats trim/AOT warnings as errors.
    - name: Publish
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o ./artifacts/aot
    - name: Run (Linux)
      if: runner.os == 'Linux'
      working-directory: artifacts/aot
      run: ./AotSmoke
    - name: Run (Windows)
      if: runner.os == 'Windows'
      working-directory: artifacts/aot
      run: ./AotSmoke.exe
    - name: Pack for consumer validation
      run: dotnet pack Arc.Crypto/Arc.Crypto.csproj -c Release -p:PackageVersion=${{ env.AOT_PACKAGE_VERSION }} -o ./artifacts/packages
    - name: Restore NuGet consumer
      # Keep local paths and URLs in config to avoid Windows CLI source normalization.
      run: dotnet restore AotSmoke/AotSmoke.csproj -r ${{ matrix.rid }} -p:ArcCryptoPackageVersion=${{ env.AOT_PACKAGE_VERSION }} --configfile .github/nuget-aot.config
    - name: Publish NuGet consumer
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -p:ArcCryptoPackageVersion=${{ env.AOT_PACKAGE_VERSION }} --no-restore -o ./artifacts/aot-package
    - name: Run NuGet consumer (Linux)
      if: runner.os == 'Linux'
      working-directory: artifacts/aot-package
      run: ./AotSmoke
    - name: Run NuGet consumer (Windows)
      if: runner.os == 'Windows'
      working-directory: artifacts/aot-package
      run: ./AotSmoke.exe

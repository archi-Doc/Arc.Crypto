name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Test portable implementations
      env:
        DOTNET_EnableHWIntrinsic: '0'
      run: dotnet test --project Test/Test.csproj -c Release --no-build
    - name: Install coverage tool
      run: dotnet tool install --tool-path ./artifacts/tools dotnet-coverage --version 18.11.0
    - name: Collect coverage
      run: ./artifacts/tools/dotnet-coverage collect -s Test/coverage.config -f cobertura -o artifacts/coverage/coverage.cobertura.xml dotnet Test/bin/Release/net10.0/Test.dll
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: artifacts/coverage/coverage.cobertura.xml

  nativeaot:
    name: Native AOT (${{ matrix.rid }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install Native AOT prerequisites
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    # AotSmoke roots the entire library and treats trim/AOT warnings as errors.
    - name: Publish
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o ./artifacts/aot
    - name: Run (Linux)
      if: runner.os == 'Linux'
      working-directory: artifacts/aot
      run: ./AotSmoke
    - name: Run (Windows)
      if: runner.os == 'Windows'
      working-directory: artifacts/aot
      run: ./AotSmoke.exe
    - name: Pack for consumer validation
      run: dotnet pack Arc.Crypto/Arc.Crypto.csproj -c Release -p:PackageVersion=1.0.0-aot-validation -o ./artifacts/packages
    - name: Restore NuGet consumer
      # Keep local paths and URLs in config to avoid Windows CLI source normalization.
      run: dotnet restore AotSmoke/AotSmoke.csproj -r ${{ matrix.rid }} -p:ArcCryptoPackageVersion=1.0.0-aot-validation --configfile .github/nuget-aot.config
    - name: Publish NuGet consumer
      run: dotnet publish AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -p:ArcCryptoPackageVersion=1.0.0-aot-validation --no-restore -o ./artifacts/aot-package
    - name: Run NuGet consumer (Linux)
      if: runner.os == 'Linux'
      working-directory: artifacts/aot-package
      run: ./AotSmoke
    - name: Run NuGet consumer (Windows)
      if: runner.os == 'Windows'
      working-directory: artifacts/aot-package
      run: ./AotSmoke.exe

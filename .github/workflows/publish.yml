name: Publish NuGet
on: workflow_dispatch

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      # Test the Release build that is packed (a plain dotnet test would rebuild and test Debug).
      run: dotnet test --project Test/Test.csproj -c Release --no-build

    - name: Package
      run: dotnet pack -c Release -o bin Arc.Crypto/Arc.Crypto.csproj
    - name: Publish
      run: dotnet nuget push bin/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
